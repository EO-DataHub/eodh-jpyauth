[project]
name = "jupyter-keycloak-authenticator"
version = "0.1.0"
description = "A JupyterHub OIDC authenticator for Keycloak"
readme = "README.md"
authors = [
    { name = "Steven Gillies", email = "steven.gillies@telespazio.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jupyter-keycloak-authenticator = "jupyter_keycloak_authenticator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
